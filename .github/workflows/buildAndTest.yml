name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    types: [assigned, opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NIX_CONFIG: |-
    accept-flake-config = true

jobs:
  clang-format:
    name: Git clang-format
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          submodules: false
      - name: Check C++ formatting
        env:
          PR_BASE: ${{ github.base_ref }}
        run: |
          if [[ -z "$PR_BASE" ]]; then
            diff_commit=HEAD^
          else
            git fetch --no-recurse-submodules origin "$PR_BASE"
            diff_commit=$(git rev-parse "origin/$PR_BASE")
          fi
          export DIFF_COMMIT="$diff_commit"

          # The single-quoted script is expanded by the inner Nix-shell bash.
          # shellcheck disable=SC2016
          nix develop -L .#lint --command bash -euo pipefail -c '
            git clang-format "$DIFF_COMMIT"
            git diff --exit-code --ignore-submodules
          '

  yapf:
    name: YAPF
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          submodules: false
      - name: Check Python formatting
        env:
          PR_BASE: ${{ github.base_ref }}
        run: |
          if [[ -z "$PR_BASE" ]]; then
            diff_commit=HEAD^
          else
            git fetch --no-recurse-submodules origin "$PR_BASE"
            diff_commit=$(git rev-parse "origin/$PR_BASE")
          fi
          export DIFF_COMMIT="$diff_commit"

          # The single-quoted script is expanded by the inner Nix-shell bash.
          # shellcheck disable=SC2016
          nix develop -L .#lint --command bash -euo pipefail -c '
            mapfile -d "" files < <(
              git diff --name-only --diff-filter=d -z \
                "$DIFF_COMMIT" -- "*.py"
            )
            if (( ${#files[@]} == 0 )); then
              exit 0
            fi
            yapf --in-place "${files[@]}"
            git diff --exit-code -- "${files[@]}"
          '

  slang-tests:
    name: Slang test metadata
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          submodules: false
      - name: Check valgrind exclusions
        run: |
          nix develop -L .#lint --command \
            python3 utils/find_slang_tests_without_valgrind.py test
          nix develop -L .#lint --command \
            python3 utils/find_slang_tests_without_valgrind.py \
              integration_test

  build-and-test:
    name: Run CIRCT Checks
    needs: [clang-format, yapf, slang-tests]
    runs-on: [self-hosted, BIGRAM]
    steps:
      - name: Select CIRCT check variants
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          variants=(full)
          if [[ "$EVENT_NAME" == push \
                && "$EVENT_REF" == refs/heads/master ]]; then
            variants+=(clang)
          fi
          printf 'CIRCT_CHECK_VARIANTS=%s\n' "${variants[*]}" \
            >> "$GITHUB_ENV"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Nix requires revCount metadata for git+file flake inputs.
          fetch-depth: 0
          submodules: false
      - name: Read LLVM revision
        run: |
          llvm_revision=$(git ls-tree HEAD llvm \
            | awk '$1 == "160000" { print $3 }')
          [[ "$llvm_revision" =~ ^[0-9a-f]{40}$ ]]
          echo "LLVM_REVISION=$llvm_revision" >> "$GITHUB_ENV"
          mkdir -p .nix-results
      - name: Restore sccache objects
        run: |
          : "${NIX_SCCACHE_DIR:?The runner must set NIX_SCCACHE_DIR}"
          [[ "$NIX_SCCACHE_DIR" == /* ]]
          [[ -d "$NIX_SCCACHE_DIR" && -w "$NIX_SCCACHE_DIR" ]]
          command -v rclone >/dev/null
          mkdir -p "$NIX_SCCACHE_DIR/circt-sccache"

          # A failed refresh leaves the existing machine-local cache usable.
          if ! rclone copy sccache:circt-sccache \
              "$NIX_SCCACHE_DIR/circt-sccache" \
              --fast-list --size-only --use-server-modtime; then
            echo "::warning::Unable to refresh sccache objects; continuing with the local cache"
          fi
      - name: Build and test CIRCT
        timeout-minutes: 300
        run: |
          override=(
            --no-update-lock-file
            --override-input circt-src "git+file://$GITHUB_WORKSPACE"
            --override-input llvm-src \
              "github:llvm/llvm-project/$LLVM_REVISION"
          )

          run_variant() {
            local variant="$1"

            nix build -L \
              ".#checks.x86_64-linux.${variant}^*" \
              "${override[@]}" \
              --out-link ".nix-results/$variant" \
              || return
            ".nix-results/$variant/bin/firtool" --version || return
          }

          status=0
          read -r -a variants <<< "$CIRCT_CHECK_VARIANTS"
          for variant in "${variants[@]}"; do
            if ! run_variant "$variant"; then
              status=1
            fi
          done
          exit "$status"
      - name: Upload objects
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: |
          : "${NIX_SCCACHE_DIR:?The runner must set NIX_SCCACHE_DIR}"
          [[ "$NIX_SCCACHE_DIR" == /* ]]
          [[ -d "$NIX_SCCACHE_DIR/circt-sccache" ]]
          command -v rclone >/dev/null

          # Restore preserved each object's server upload time locally. The
          # age filter prevents pruned objects from being uploaded again.
          rclone copy "$NIX_SCCACHE_DIR/circt-sccache" \
            sccache:circt-sccache --fast-list --max-age 7d --size-only
      - name: Prune objects
        if: ${{ success() && github.ref == 'refs/heads/master' }}
        continue-on-error: true
        run: |
          : "${NIX_SCCACHE_DIR:?The runner must set NIX_SCCACHE_DIR}"
          [[ "$NIX_SCCACHE_DIR" == /* ]]
          [[ -d "$NIX_SCCACHE_DIR/circt-sccache" ]]
          command -v rclone >/dev/null

          # The scratch store is shared by all runners on this machine, so it
          # is pruned here rather than when an ephemeral runner restarts.
          rclone delete ":local:$NIX_SCCACHE_DIR/circt-sccache" \
            --fast-list --min-age 7d
          rclone delete sccache:circt-sccache \
            --fast-list --min-age 7d --use-server-modtime

  ci-result:
    name: Package PR and Run Checks
    needs:
      - clang-format
      - yapf
      - slang-tests
      - build-and-test
    if: ${{ always() && !cancelled() }}
    runs-on: self-hosted
    steps:
      - name: Require every CI job to pass
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          CLANG_FORMAT_RESULT: ${{ needs.clang-format.result }}
          SLANG_TESTS_RESULT: ${{ needs.slang-tests.result }}
          YAPF_RESULT: ${{ needs.yapf.result }}
        run: |
          printf 'clang-format=%s\nyapf=%s\nslang-tests=%s\nbuild=%s\n' \
            "$CLANG_FORMAT_RESULT" "$YAPF_RESULT" \
            "$SLANG_TESTS_RESULT" "$BUILD_RESULT"
          [[ "$CLANG_FORMAT_RESULT" == success ]]
          [[ "$YAPF_RESULT" == success ]]
          [[ "$SLANG_TESTS_RESULT" == success ]]
          [[ "$BUILD_RESULT" == success ]]
