name: PyCDE Publish

on:
  push:
    tags:
      - pycde-*
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  #  Build CIRCT and PyCDE once per OS and run the CIRCT and PyCDE tests. The
  #  configurations match the ones in buildAndTest.yml so that they reuse the
  #  sccache populated by builds on main.
  # ---------------------------------------------------------------------------

  test:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Test (Linux)
            runner: ubuntu-24.04
            cmake_c_compiler: gcc
            build_shared_libs: "ON"
          - name: Test (Windows)
            runner: windows-2022
            cmake_c_compiler: cl
            build_shared_libs: "OFF"
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/unifiedBuildTestAndInstall.yml
    with:
      runner: ${{ matrix.runner }}
      cmake_build_type: release
      build_shared_libs: ${{ matrix.build_shared_libs }}
      llvm_enable_assertions: "ON"
      run_tests: true
      cmake_c_compiler: ${{ matrix.cmake_c_compiler }}
      build_pycde: true

  # ---------------------------------------------------------------------------
  #  Build Linux wheels. The CIRCT and PyCDE tests are run by the 'test' job
  #  above and the ESI runtime tests by the 'test-esi-runtime' job below.
  # ---------------------------------------------------------------------------

  build-linux:
    name: Build
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-env:
          - cp310-manylinux_x86_64
          - cp311-manylinux_x86_64
          - cp312-manylinux_x86_64
          - cp313-manylinux_x86_64
          - cp314-manylinux_x86_64
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Get CIRCT (no submodules)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Get shallow LLVM submodule
        run: |
          git submodule update --init --recursive --recommend-shallow --depth 1

      - name: Install dependencies
        run: |
          set -o errexit
          python3 -m pip install --upgrade pip
          python3 -m pip install cibuildwheel twine

      - name: sccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: pycde-publish-${{ runner.os }}-${{ matrix.python-env }}
          max-size: 500M
          variant: sccache
          install: binary

      # Build CIRCT and run its tests using a Docker container with all the
      # integration testing prerequisite installed.
      - name: Build wheel
        env:
          CIBW_BUILD: ${{ matrix.python-env }}
          CMAKE_GENERATOR: Ninja
          SETUPTOOLS_SCM_DEBUG: True
          BUILD_TYPE: Release
          # The CIRCT and PyCDE tests are run once by the 'test' job instead of
          # in every wheel build.
          RUN_TESTS: False
          # cibuildwheel mounts the host at /host; keep the cache on the host
          # so the cache action can restore and save it.
          COMPILER_LAUNCHER: /host/usr/local/bin/sccache
          CIBW_ENVIRONMENT_LINUX: >-
            SCCACHE_DIR=/host${{ github.workspace }}/.sccache
            SCCACHE_CACHE_SIZE=500M
        run: |
          set -o errexit
          export PATH=$PATH:$HOME/.local/bin

          echo "Building wheel"
          cibuildwheel --output-dir wheelhouse frontends/PyCDE

      - name: Get wheel name
        shell: bash
        id: whl-name
        run: |
          cd wheelhouse
          echo WHL=`ls *.whl` >> "$GITHUB_OUTPUT"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.whl-name.outputs.WHL }}
          path: wheelhouse/${{ steps.whl-name.outputs.WHL }}
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  Build Windows wheels.
  # ---------------------------------------------------------------------------

  build-windows:
    name: Build
    runs-on: windows-2022
    strategy:
      matrix:
        python-env:
          - cp310-win_amd64
          - cp311-win_amd64
          - cp312-win_amd64
          - cp313-win_amd64
          - cp314-win_amd64
    steps:
      # Since we don't use docker on Windows, we need to install the dependencies.
      - name: Build additional c++ deps
        shell: pwsh
        run: |
          & "${env:VCPKG_INSTALLATION_ROOT}/vcpkg" --triplet x64-windows install zlib
          "${env:VCPKG_INSTALLATION_ROOT}/installed/x64-windows/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Get CIRCT
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Get shallow LLVM submodule
        run: |
          git submodule update --init --recursive --recommend-shallow --depth 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel twine
          choco install ninja

      - name: sccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: pycde-publish-${{ runner.os }}-${{ matrix.python-env }}
          max-size: 500M
          variant: sccache

      - name: Build wheel
        shell: cmd
        env:
          CIBW_BUILD: ${{ matrix.python-env }}
          CMAKE_GENERATOR: Ninja
          SETUPTOOLS_SCM_DEBUG: True
          BUILD_TYPE: Release
          COMPILER_LAUNCHER: sccache
          # The CIRCT and PyCDE tests are run once by the 'test' job instead of
          # in every wheel build.
          RUN_TESTS: False
        run: |
          echo "Building wheel"
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 && python -m cibuildwheel --output-dir wheelhouse frontends/PyCDE

      - name: Get wheel name
        shell: bash
        id: whl-name
        run: |
          cd wheelhouse
          echo WHL=`ls *.whl` >> "$GITHUB_OUTPUT"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.whl-name.outputs.WHL }}
          path: wheelhouse/${{ steps.whl-name.outputs.WHL }}
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  #  Run the ESI runtime tests against the wheels built above, on Linux and
  #  Windows, for every Python version we publish.
  # ---------------------------------------------------------------------------

  test-esi-runtime:
    name: Test ESI runtime (Python ${{ matrix.python_version }})
    needs:
      - build-linux
      - build-windows
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    permissions:
      contents: read
    uses: ./.github/workflows/testESIRuntime.yml
    with:
      python_version: ${{ matrix.python_version }}
      pycde_from_artifacts: true

  # ---------------------------------------------------------------------------
  #  If the tests and both the Linux and Windows builds are successful, push the
  #  wheels to pypi. Only do this on the main branch or a tag.
  # ---------------------------------------------------------------------------

  push_wheels:
    name: Push wheels (Tag or Weekly)
    runs-on: ubuntu-24.04
    if: github.repository == 'llvm/circt' && ( github.ref == 'refs/heads/main' || github.ref_type == 'tag' )
    needs:
      - test
      - test-esi-runtime
      - build-linux
      - build-windows
    environment:
      name: pypi
      url: https://pypi.org/p/esiaccel
    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./wheelhouse/
          merge-multiple: true

      - name: List downloaded wheels
        run: ls -laR
        working-directory: ./wheelhouse/

      - name: Upload wheels to pypi
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: wheelhouse/
          verify-metadata: false
