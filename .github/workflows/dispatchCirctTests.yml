name: Dispatch circt-tests

# Trigger a test run in circt/circt-tests once a "Build and Test" run has
# finished. We use `workflow_run` rather than driving the dispatch directly
# from `buildAndTest.yml` because `pull_request` events from forks run with a
# read-only token and no access to repository secrets. `workflow_run`, by
# contrast, executes in the context of this repository and has the
# `CIRCT_TESTS_DISPATCH_TOKEN` available regardless of where the PR
# originated.
on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  dispatch:
    name: Dispatch circt-tests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.CIRCT_TESTS_DISPATCH_TOKEN }}
    steps:
      - name: Initialize diagnostics
        env:
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TOKEN_CONFIGURED: ${{ env.GH_TOKEN != '' }}
        run: |
          diagnostics="$RUNNER_TEMP/circt-tests-dispatch"
          echo "DIAGNOSTICS=$diagnostics" >> "$GITHUB_ENV"
          mkdir -p "$diagnostics"
          printf 'event=%s\nhead-repo=%s\nhead-sha=%s\nrun-id=%s\nconclusion=%s\ntoken-configured=%s\n' \
            "$EVENT_NAME" "$HEAD_REPO" "$HEAD_SHA" "$RUN_ID" \
            "$RUN_CONCLUSION" "$TOKEN_CONFIGURED" \
            > "$diagnostics/run-metadata.txt"

      # Pull the small metadata artifact uploaded by buildAndTest.yml. It
      # contains the PR number (when applicable). Treat it as untrusted until
      # it has been matched against the workflow run's REST API association.
      - name: Download dispatch metadata
        if: >-
          github.event.workflow_run.conclusion == 'success' &&
          env.GH_TOKEN != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dispatch-metadata
          path: ${{ runner.temp }}/circt-tests-dispatch/upstream-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Require dispatch token
        if: >-
          github.event.workflow_run.conclusion == 'success' &&
          env.GH_TOKEN == ''
        run: |
          echo "CIRCT_TESTS_DISPATCH_TOKEN is not configured." \
            | tee -a "$DIAGNOSTICS/dispatch.log"
          exit 1

      - name: Dispatch circt-tests
        if: >-
          github.event.workflow_run.conclusion == 'success' &&
          env.GH_TOKEN != ''
        env:
          API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASE_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          exec > >(tee -a "$DIAGNOSTICS/dispatch.log") 2>&1
          if [ "$EVENT_NAME" = "push" ]; then
            KIND="main"
            SHA="$HEAD_SHA"
            REPO="$BASE_REPO"
            PR_NUMBER=""
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            KIND="pr"
            PR_NUMBER=$(cat "$DIAGNOSTICS/upstream-metadata/pr_number")
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]

            associated_prs=$(GH_TOKEN="$API_TOKEN" gh api \
              "repos/$BASE_REPO/actions/runs/$RUN_ID/pull_requests")
            [[ "$(jq 'length' <<< "$associated_prs")" == "1" ]]
            api_pr_number=$(jq -r '.[0].number' <<< "$associated_prs")
            [[ "$PR_NUMBER" == "$api_pr_number" ]]

            # Bind the downstream run to the immutable workflow-run snapshot,
            # not to the PR's potentially force-pushed current head.
            SHA="$HEAD_SHA"
            REPO="$HEAD_REPO"
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ -n "$REPO" && "$REPO" != "null" ]]
          else
            echo "Unhandled event type: $EVENT_NAME, skipping."
            exit 0
          fi
          DISPATCH_ARGS=(-f "kind=$KIND" -f "sha=$SHA" -f "repo=$REPO")
          if [ -n "$PR_NUMBER" ]; then
            DISPATCH_ARGS+=(-f "pr_number=$PR_NUMBER")
          fi
          printf 'Dispatching circt-tests: kind=%s sha=%s repo=%s pr=%s\n' \
            "$KIND" "$SHA" "$REPO" "$PR_NUMBER"
          gh workflow run test.yml --repo circt/circt-tests \
            "${DISPATCH_ARGS[@]}"

      - name: Upload dispatch diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circt-tests-dispatch-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/circt-tests-dispatch/
          if-no-files-found: error
          retention-days: 7
