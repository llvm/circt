name: Test PyCDE and the ESI runtime

env:
  # Match the simulator used by the former pycde-esi-test image.
  verilator-version: "5.040"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"
  pull_request:
    paths:
      - ".github/workflows/testPycdeESI.yml"
      - "frontends/PyCDE/**"
      - "lib/Dialect/ESI/runtime/**"

# Cancel previous CI builds when a new push occurs to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  #  Build and test CIRCT, PyCDE, and the ESI runtime on the Linux VM.
  # ---------------------------------------------------------------------------

  build-linux:
    name: Build and Test
    runs-on: ubuntu-24.04
    strategy:
      # Keep the 'matrix' strategy with one data point to make it obvious that
      # this is one point in the overall matrix.
      matrix:
        build-assert: [ON]
        build-shared: [ON]
        build-type: [Release]
        compiler:
          - cc: clang-18
            cxx: clang++-18

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          tool-cache: false

      # Clone the CIRCT repo and its submodules. Do shallow clone to save clone
      # time.
      - name: Get CIRCT
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          submodules: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf bison build-essential clang-18 cmake curl flex help2man \
            iverilog libffi-dev libfl-dev libssl-dev libsystemc-dev lld \
            ninja-build python3-dev python3-venv valgrind zlib1g-dev

      - name: Restore Verilator cache
        id: cache-verilator
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/verilator
          key: verilator-ubuntu-24.04-${{ runner.arch }}-${{ env.verilator-version }}

      - name: Install Verilator
        env:
          VERILATOR_VERSION: ${{ env.verilator-version }}
          CACHE_HIT: ${{ steps.cache-verilator.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != "true" ]]; then
            mkdir -p "$RUNNER_TEMP/verilator-src"
            curl --fail --location --retry 3 \
              "https://github.com/verilator/verilator/archive/v$VERILATOR_VERSION.tar.gz" \
              -o "$RUNNER_TEMP/verilator.tar.gz"
            tar -xzf "$RUNNER_TEMP/verilator.tar.gz" \
              -C "$RUNNER_TEMP/verilator-src" --strip-components=1
            cd "$RUNNER_TEMP/verilator-src"
            autoconf
            ./configure --prefix="$RUNNER_TEMP/verilator"
            make -j"$(nproc)"
            make install
          fi
          echo "$RUNNER_TEMP/verilator/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/verilator/bin/verilator" --version | grep -F "Verilator $VERILATOR_VERSION "

      - name: Save Verilator cache
        if: github.event_name != 'pull_request' && steps.cache-verilator.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/verilator
          key: verilator-ubuntu-24.04-${{ runner.arch }}-${{ env.verilator-version }}

      - name: Setup venv and install dependencies
        run: |
          set -o errexit
          python3 -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r frontends/PyCDE/python/requirements.txt
          pip install pytest pybind11==2.11.2 click

      - name: sccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: pycde-${{ matrix.compiler.cc }}-${{ matrix.build-type }}-${{ matrix.build-shared }}-${{ matrix.build-assert }}
          max-size: 500M
          variant: sccache

      # --------
      # Build and test CIRCT
      # --------

      - name: Configure CIRCT
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
          BUILD_ASSERT: ${{ matrix.build-assert }}
          BUILD_SHARED: ${{ matrix.build-shared }}
          BUILD_TYPE: ${{ matrix.build-type }}
        run: |
          . venv/bin/activate
          mkdir build && cd build
          cmake -GNinja ../llvm/llvm \
            -DBUILD_SHARED_LIBS=$BUILD_SHARED \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DLLVM_ENABLE_ASSERTIONS=$BUILD_ASSERT \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_EXTERNAL_PROJECTS=circt \
            -DLLVM_EXTERNAL_CIRCT_SOURCE_DIR=.. \
            -DLLVM_TARGETS_TO_BUILD="host" \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_USE_SPLIT_DWARF=ON \
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
            -DCIRCT_BINDINGS_PYTHON_ENABLED=ON \
            -DPython_EXECUTABLE="$(command -v python3)" \
            -DPython3_EXECUTABLE="$(command -v python3)" \
            -DCIRCT_ENABLE_FRONTENDS=PyCDE \
            -DESI_RUNTIME=ON \
            -DLLVM_LIT_ARGS="-v --show-unsupported" \
            -DCIRCT_SLANG_FRONTEND_ENABLED=ON

      - name: Test CIRCT
        run: |
          . venv/bin/activate
          ninja -C build check-circt -j$(nproc)
      - name: Test PyCDE
        run: |
          . venv/bin/activate
          ninja -C build check-pycde -j$(nproc)
      # The PyCDE integration tests exercise the ESI runtime.
      - name: Test PyCDE and ESI runtime integration
        run: |
          . venv/bin/activate
          ninja -C build check-pycde-integration -j$(nproc)

      - name: Test ESI runtime (pytest)
        run: |
          . venv/bin/activate
          # Install the ESI C++ runtime into the esiaccel Python package tree
          # so that cmake-based tests can find headers, libraries, and the
          # esiaccelConfig.cmake.
          cmake --install build \
            --prefix build/tools/circt/lib/Dialect/ESI/runtime/python/esiaccel \
            --component ESIRuntime
          export PYTHONPATH="$PWD/build/tools/circt/python_packages/pycde:$PWD/build/tools/circt/lib/Dialect/ESI/runtime/python"
          export PATH="$PWD/build/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/build/lib:$LD_LIBRARY_PATH"
          ninja -C build ESIRuntimeCppTests -j$(nproc)
          python3 -m pytest lib/Dialect/ESI/runtime/tests/ -v --log-cli-level=INFO
